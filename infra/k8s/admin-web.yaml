# 다이어그램: 관리자 웹 (nginx 정적 SPA) — 백엔드와 ALB 한 대를 공유하고 /admin 아래에서 서비스된다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dib-admin-web
spec:
  replicas: 1 # 정적 파일이라 한 대로 충분하다
  selector:
    matchLabels:
      app: dib-admin-web
  template:
    metadata:
      labels:
        app: dib-admin-web
    spec:
      containers:
        - name: web
          image: __ECR__/dib-admin-web:latest
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 80 }
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: dib-admin-web
spec:
  selector:
    app: dib-admin-web
  ports:
    - port: 80
      targetPort: 80
